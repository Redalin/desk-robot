services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desk-robot-brain
    restart: unless-stopped
    # stdin_open & tty are required so main.py's console_loop doesn't see EOF and exit
    stdin_open: true
    tty: true
    ports:
      - "8765:8765"   # Robot WebSocket connection
      - "8766:8766"   # Browser Live View Console
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_API_KEY
      - LLM_BASE_URL
      - MODEL
      - ROBOT_TOKEN
      - HUMAN_NAME
      - ROBOT_NAME
      - FISH_AUDIO_API_KEY
      - OPENROUTER_API_KEY
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - OPENAI_API_KEY
      - GROQ_API_KEY
      - LIVE_VIEW_BIND=0.0.0.0
      - LIVE_VIEW_PORT=8766
    volumes:
      # Mount brain so code and liveview updates are immediately available
      - ./brain:/app/brain
      # Persist downloaded speech models (Whisper, Silero VAD, Smart Turn)
      - brain-cache:/root/.cache
      # Optional: mount debug output directory to inspect TTS audio / recordings
      - ./debug:/app/debug

volumes:
  brain-cache:
    name: desk-robot-cache