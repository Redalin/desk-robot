[env:esp32s3_supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_SH1106_OLED=1   ; 1 = 1.3" I2C SH1106 OLED (128x64), 0 = GC9A01 SPI Round TFT (240x240)
lib_deps =
    adafruit/Adafruit GC9A01A@^1.1.0
    adafruit/Adafruit SH110X@^2.1.10
    adafruit/Adafruit GFX Library@^1.11.9
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.0

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = direct, time

; Upload Settings
upload_speed = 921600

; Explicit 4MB Flash and DIO mode for ESP32-S3 SuperMini
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Optional TFT environment (GC9A01 240x240 Round SPI TFT)
[env:esp32s3_supermini_tft]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_SH1106_OLED=0
lib_deps = ${env:esp32s3_supermini.lib_deps}
monitor_speed = ${env:esp32s3_supermini.monitor_speed}
monitor_filters = ${env:esp32s3_supermini.monitor_filters}
upload_speed = ${env:esp32s3_supermini.upload_speed}
board_build.flash_mode = ${env:esp32s3_supermini.board_build.flash_mode}
board_build.flash_size = ${env:esp32s3_supermini.board_build.flash_size}
board_upload.flash_size = ${env:esp32s3_supermini.board_upload.flash_size}
board_build.partitions = ${env:esp32s3_supermini.board_build.partitions}